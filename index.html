<!DOCTYPE html>
<html>
<head>
  <title>PSL Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
  <h2>PSL Manager</h2>
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('auction')">Auction</button>
  <button onclick="showTab('squad')">Squad</button>
  <button onclick="showTab('schedule')">Schedule</button>
  <button onclick="showTab('match')">Match</button>
  <button onclick="showTab('stats')">Stats</button>
  <button onclick="showTab('standings')">Standings</button>
  <button onclick="showTab('budget')">Budget</button>
  <button onclick="showTab('history')">History</button>
</div>

<div id="content">
  <div id="home" class="tab">Select your team to begin.</div>
  <div id="auction" class="tab"></div>
  <div id="squad" class="tab"></div>
  <div id="schedule" class="tab"></div>

  <div id="match" class="tab">
    <h2>Match Center</h2>
    <button onclick="playBallUI()">Play Ball</button>
    <button onclick="playOverUI()">Play Over</button>
    <button onclick="simulateFull()">Sim Match</button>

    <h3>Commentary</h3>
    <pre id="commentary"></pre>

    <h3>Batting Scorecard</h3>
    <table id="battingTable"></table>

    <h3>Bowling Figures</h3>
    <table id="bowlingTable"></table>
  </div>

  <div id="stats" class="tab"></div>
  <div id="standings" class="tab"></div>
  <div id="budget" class="tab"></div>
  <div id="history" class="tab"></div>
</div>

<!-- JS FILES -->
<script src="teams.js"></script>
<script src="players.js"></script>
<script src="schedule.js"></script>
<script src="auction.js"></script>
<script src="matchEngine.js"></script>
<script src="finance.js"></script>
<script src="stats.js"></script>
<script src="season.js"></script>
<script src="pitch.js"></script>
<script src="fitness.js"></script>
<script src="injuries.js"></script>
<script src="aging.js"></script>
<script src="retirement.js"></script>
<script src="retention.js"></script>
<script src="app.js"></script>

</body>
</html>
